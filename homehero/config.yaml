name: HomeHero
version: "0.3.1"
slug: homehero
description: Stanje doma, pametna razdelitev čiščenja, točke (PWA)
url: https://github.com/TadejBartol/homehero-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/tadejbartol/homehero-{arch}
init: false
startup: application
boot: auto
ports:
  3000/tcp: 8271
ports_description:
  3000/tcp: Spletna aplikacija in API (za Cloudflare Tunnel)
watchdog: http://[HOST]:[PORT:3000]/api/health
# skrbniški pregled strežnika (domovi, uporabniki, brisanje) – samo za skrbnike HA
ingress: true
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: HomeHero
panel_admin: true
backup: hot
options:
  base_url: https://homehero.gbartol.com
  smtp_url: ""
  mail_from: HomeHero <no-reply@gbartol.com>
schema:
  base_url: url
  smtp_url: password?
  mail_from: str?
  require_email_verification: bool?
  google_client_id: str?
  google_client_secret: password?
